name: Sync to Gitee

on:
  push:
    branches:
      - main
  delete:
  release:
    types:
      - published
      - edited
      - unpublished
      - deleted
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    gitee-sync-${{ github.repository }}-${{
      github.event_name == 'release' && github.event.release.tag_name || 'code'
    }}
  cancel-in-progress: false

env:
  GITEE_OWNER: ${{ vars.GITEE_OWNER || 'ai-dvps' }}
  GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}
  GITEE_REPOSITORY_DESCRIPTION: ${{ github.event.repository.description }}
  GITEE_REPOSITORY_HOMEPAGE: ${{ github.event.repository.html_url }}
  GITEE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}

jobs:
  sync-code:
    name: Mirror branches and tags
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: gitee-mirror
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DELETED_REF_NAME: ${{ github.event.ref }}
      DELETED_REF_TYPE: ${{ github.event.ref_type }}
      RELEASE_ACTION: ${{ github.event.action }}
    steps:
      - name: Checkout trusted automation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/sync-gitee.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure the Gitee repository exists
        run: node scripts/sync-gitee.mjs ensure-repository

      - name: Mirror Git branches and tags
        shell: bash
        run: |
          set -euo pipefail
          mirror_dir="$(mktemp -d "$RUNNER_TEMP/gitee-mirror.XXXXXX")"
          source_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          target_url="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git init --bare "$mirror_dir"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git -C "$mirror_dir" fetch "$source_url" "+${GITHUB_REF}:${GITHUB_REF}"
            git -C "$mirror_dir" push "$target_url" "+${GITHUB_REF}:${GITHUB_REF}"
          elif [[ "$GITHUB_EVENT_NAME" == "delete" ]]; then
            if [[ "$DELETED_REF_TYPE" == "branch" ]]; then
              deleted_ref="refs/heads/${DELETED_REF_NAME}"
            else
              deleted_ref="refs/tags/${DELETED_REF_NAME}"
            fi
            if git ls-remote --exit-code --refs "$target_url" "$deleted_ref" >/dev/null 2>&1; then
              git -C "$mirror_dir" push "$target_url" ":${deleted_ref}"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            release_ref="refs/tags/${RELEASE_TAG}"
            if [[ "$RELEASE_ACTION" == "published" || "$RELEASE_ACTION" == "edited" ]]; then
              git -C "$mirror_dir" fetch "$source_url" "+${release_ref}:${release_ref}"
              git -C "$mirror_dir" push "$target_url" "+${release_ref}:${release_ref}"
            fi
          else
            git -C "$mirror_dir" fetch --prune --prune-tags "$source_url" \
              '+refs/heads/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*'
            git -C "$mirror_dir" push --prune "$target_url" \
              '+refs/heads/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*'
          fi

  sync-release:
    name: Mirror published release
    if: >-
      github.event_name == 'release' &&
      (github.event.action == 'published' || github.event.action == 'edited') &&
      github.event.release.draft == false
    needs: sync-code
    runs-on: ubuntu-latest
    environment: gitee-mirror
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout trusted automation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/sync-gitee.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$(mktemp -d "$RUNNER_TEMP/gitee-release-assets.XXXXXX")"
          asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$asset_count" -gt 0 ]]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$asset_dir"
          fi
          echo "GITEE_ASSET_DIR=$asset_dir" >> "$GITHUB_ENV"

      - name: Sync release metadata and assets
        run: node scripts/sync-gitee.mjs sync-release "$GITEE_ASSET_DIR"

  delete-release:
    name: Remove withdrawn release
    if: >-
      github.event_name == 'release' &&
      (github.event.action == 'unpublished' || github.event.action == 'deleted')
    needs: sync-code
    runs-on: ubuntu-latest
    environment: gitee-mirror
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout trusted automation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/sync-gitee.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete the Gitee release
        run: node scripts/sync-gitee.mjs delete-release
