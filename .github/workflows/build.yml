name: Build

# U4 (R3 CI, KTD-3, KTD-9): electron-builder release pipeline.
#
# Flow per platform: sidecar → native CDP contract gate → Electron shell-path
# CDP gate → renderer bundle →
# electron-builder package → signature verification → update-manifest guard →
# bridge artifact repack + tauri-signer sign (U6) → draft-release endpoint
# test. A final bridge-manifest job (U6, KTD-3) then generates the tauri-format
# latest.json pointing at the Electron installers, verifies every platform
# signature against the RELEASED bytes (KTD-9 order guard: minisign runs
# AFTER Authenticode/notarize), uploads it to the same draft release, and
# fails the build when latest.json is absent. Guards ported from the
# tauri-era pipeline
# (docs/solutions/workflow-issues/tauri-v2-signed-auto-updater-ci-release.md):
# conditional signing config, draft-first-then-test-endpoints, and
# missing-manifest = build failure.
#
# Signing and updater-metadata contract:
#  - Update manifests (latest.yml / latest-mac.yml / latest-linux.yml) and
#    blockmaps are generated and guarded on every build.
#  - Credentials present → signed/notarized build published by electron-builder.
#  - Credentials absent → UNSIGNED macOS/Windows build; installers, manifests,
#    and blockmaps are uploaded explicitly and must be labeled unsigned in the
#    release notes. Linux has no platform signing requirement and is always
#    published.
#
# FOOTGUN (KTD-1): electron-builder does NOT auto-discover
# electron-builder.config.ts — the --config flag below is load-bearing. A bare
# run silently builds with defaults and attempts an Electron-ABI rebuild of
# better-sqlite3, corrupting the sidecar resource. The effective-config guard
# step fails the build if our config was not loaded.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Single macOS arm64 runner produces BOTH architectures in one
          # electron-builder invocation (U3: the shell has no native modules,
          # so no universal build is needed).
          - platform: macos-latest
            builder-args: '--mac --x64 --arm64'
          - platform: windows-2022
            builder-args: '--win'
          # U10 (R3, KTD-5): AppImage (auto-updatable) + deb in one build.
          # 22.04 keeps the AppImage's glibc floor compatible with the oldest
          # supported Ubuntu LTS; AppImage/deb need no extra apt packages.
          - platform: ubuntu-22.04
            builder-args: '--linux'

    runs-on: ${{ matrix.platform }}
    env:
      # Signing credentials injected from GitHub secrets (KTD-9). Absent
      # secrets evaluate to empty strings; electron-builder.config.ts then
      # skips signing. Updater metadata is still generated and uploaded.
      # macOS: base64 .p12 (CSC_LINK; CSC_NAME keychain identity is the local
      # alternative, not used in CI) + App Store Connect API key for
      # notarization (APPLE_API_KEY holds the .p8 CONTENTS; a step below
      # materializes it to a file because notarytool needs a key path).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Windows: Azure Trusted Signing (cloud Authenticode). The first three
      # are the standard Microsoft Entra auth vars; the last four describe the
      # signing account/profile consumed by electron-builder azureSignOptions.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      # U6 bridge (KTD-3): minisign keypair of the OLD tauri line, used by the
      # tauri-signer steps to sign the bridge artifacts for latest.json. Same
      # secrets the tauri-era pipeline consumed (see the solutions doc).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >= 22.12 for CI robustness. electron-builder stays pinned at
          # 26.12.1 regardless (26.14+ hard-crashes on Node 20.11 via the
          # noble/hashes ESM require).
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Materialize App Store Connect API key (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          # Re-export as the key-file PATH notarytool expects; subsequent
          # steps (incl. packaging) see the path, not the .p8 contents.
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Mirrors the `release` npm script (build:sidecar + CDP gates +
      # electron-builder), split into steps so CI can add publish flags and
      # per-guard conditions.
      - name: Build sidecar
        run: npm run build:sidecar

      - name: Browser acceptance type and deterministic gates
        run: npm run typecheck && npm run test:browser-acceptance:deterministic

      - name: Install Playwright Chromium (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Install Playwright Chromium and system dependencies (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Native shell CDP contract gate
        run: npm run test:shell-cdp:required

      # Shell-path (in-app Chromium) CDP e2e gate — drives a real Electron
      # shell via Playwright, creates a view over the control channel, and
      # exercises core tools. This is the release prerequisite (plan U7
      # Verification). Linux runners are headless: xvfb provides the X server
      # Electron needs (ubuntu-22.04's unprivileged user namespaces cover the
      # Chromium sandbox, so no --no-sandbox is required).
      - name: Shell-path CDP gate (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:electron-cdp:required
      - name: Shell-path CDP gate (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron-cdp:required

      - name: Build renderer bundle
        run: npm run build:client

      # Version-consistency guard: electron-builder derives the app version,
      # artifact names and latest*.yml from package.json, while the bridge
      # steps derive everything from the git tag. A tag pushed without the
      # package.json bump would ship Comate-<pkg-version> artifacts under a
      # latest.json claiming the TAG version — passing the floor check while
      # electron-updater offers nothing. This workflow only runs on tag
      # pushes (on.push.tags: 'v*'), so the check is unconditional.
      - name: Guard tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.json version ${PKG_VERSION} — bump package.json before tagging"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION}"

      - name: Determine signing readiness
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # Must match the releaseReady logic in electron-builder.config.ts:
          # macOS requires signature AND notarization, Windows requires the
          # Azure Trusted Signing profile. Linux has no platform signing
          # requirement, so it is release-ready independently of the Tauri
          # bridge key; bridge readiness remains separate below.
          ready=false
          if [ "${{ runner.os }}" = 'macOS' ] && [ -n "$CSC_LINK" ] \
             && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            ready=true
          elif [ "${{ runner.os }}" = 'Windows' ] \
             && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
             && [ -n "$AZURE_TRUSTED_SIGNING_PUBLISHER" ] && [ -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] \
             && [ -n "$AZURE_TRUSTED_SIGNING_CERT_PROFILE" ] && [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            ready=true
          elif [ "${{ runner.os }}" = 'Linux' ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Package (publish signed builds and Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Signed and Linux builds publish through electron-builder. Unsigned
        # macOS/Windows builds use --publish never so they can be uploaded by
        # the explicit, provenance-preserving step below.
        # --config is load-bearing: see the FOOTGUN note at the top.
        run: npx electron-builder --config electron-builder.config.ts ${{ matrix.builder-args }} ${{ (steps.signing.outputs.ready == 'true' || runner.os == 'Linux') && '--publish onTagOrDraft' || '--publish never' }}

      - name: Guard packaged renderer contents
        run: npm run verify:electron:package

      - name: Guard electron-builder config discovery
        shell: bash
        run: |
          set -euo pipefail
          # Proves electron-builder.config.ts loads and carries our appId —
          # a default discovery run would silently use package.json defaults
          # (wrong layout, ABI-broken sidecar). electron-builder 26 does NOT
          # write builder-effective-config.yaml, so check the config directly
          # with the same TS loader the repo uses everywhere (tsx is a devDep).
          npx tsx -e "void (async () => { const {default: c} = await import('./electron-builder.config.ts'); if (c?.appId !== 'com.comate.app') { console.error('appId mismatch:', c?.appId); process.exit(1); } console.log('electron-builder config OK: appId', c.appId); })()"

      - name: Guard packaged updater feed
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-packaged-updater-feed.ts release "${{ runner.os }}"

      - name: Unsigned smoke build notice
        if: runner.os != 'Linux' && steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::warning::Signing credentials absent — artifacts are UNSIGNED. Installers and updater metadata will still be uploaded to the release."

      # actions/upload-artifact always wraps downloads in an outer ZIP. Upload
      # unsigned desktop release assets from the runner so the release exposes
      # each installer, updater manifest, and differential blockmap directly.
      - name: Upload unsigned macOS/Windows release assets
        if: runner.os != 'Linux' && steps.signing.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/*.exe release/latest*.yml release/*.blockmap)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no macOS/Windows release assets found under release/"; exit 1; }

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          [ "$tag_sha" = "$GITHUB_SHA" ] || {
            echo "::error::tag $GITHUB_REF_NAME moved to $tag_sha; refusing to upload assets from stale commit $GITHUB_SHA"
            exit 1
          }

          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Comate ${GITHUB_REF_NAME#v}" || \
              gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/Comate.app)
          [ "${#apps[@]}" -ge 2 ] || { echo "::error::expected x64 + arm64 unpacked apps under release/, found ${#apps[@]}"; exit 1; }
          for app in "${apps[@]}"; do
            echo "== $app =="
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
          done
          echo "macOS signatures + notarization staples verified"

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && steps.signing.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Cover app exe, NSIS installer, and uninstaller.
          $targets = @()
          $targets += Get-ChildItem 'release/win-unpacked/Comate.exe' -ErrorAction Stop
          $targets += Get-ChildItem 'release/win-unpacked/Uninstall*.exe' -ErrorAction Stop
          $targets += Get-ChildItem 'release/Comate-*-win-*.exe' -ErrorAction Stop
          foreach ($t in $targets) {
            $sig = Get-AuthenticodeSignature $t.FullName
            Write-Host "$($t.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode verification failed for $($t.FullName): $($sig.Status)"
            }
          }

      # --- U6 bridge steps (KTD-3, KTD-9) -----------------------------------
      # Ordered AFTER electron-builder packaging + signature verification:
      # Authenticode/notarize first, tauri signer (minisign) LAST, over the
      # final bytes. The .app.tar.gz is repacked from the unpacked, stapled
      # Comate.app (same signed content the zip was made from — the verify
      # step above already validated it), producing the exact layout the
      # tauri macOS updater expects (Comate.app/Contents/... at tar root).

      - name: Repack + sign macOS bridge artifacts (.app.tar.gz)
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then appdir=release/mac; else appdir=release/mac-arm64; fi
            [ -d "$appdir/Comate.app" ] || { echo "::error::$appdir/Comate.app missing"; exit 1; }
            out="release/Comate-${VERSION}-mac-${arch}.app.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "$out" -C "$appdir" Comate.app
            # TAURI-EXEMPTION (KTD-3): the tauri CLI signer produces the exact
            # .sig format old-line clients verify; consumes the same
            # TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) env as the old pipeline.
            npx --yes "@tauri-apps/cli@^2" signer sign "$out"
          done
          ls -la release/*.app.tar.gz release/*.sig

      - name: Upload macOS bridge artifacts to the draft release
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release/*.app.tar.gz release/*.sig --clobber

      - name: Sign Windows bridge artifact (NSIS exe)
        if: runner.os == 'Windows' && steps.signing.outputs.ready == 'true' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The NSIS setup exe was Authenticode-signed during the Package
          # step; minisign now runs over the FINAL bytes (KTD-9).
          $exe = Get-ChildItem 'release/Comate-*-win-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS setup exe not found under release/' }
          npx --yes "@tauri-apps/cli@^2" signer sign $exe.FullName
          Get-Item "$($exe.FullName).sig" | Out-Null

      - name: Upload Windows bridge signature to the draft release
        if: runner.os == 'Windows' && steps.signing.outputs.ready == 'true' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-Item 'release/*.sig').FullName --clobber

      # Signatures also flow to the bridge-manifest job via workflow artifacts
      # (the job regenerates + verifies latest.json against the released bytes).
      # Linux never produces bridge signatures — the tauri line had no Linux
      # clients, so latest.json carries no linux targets (U10).
      - name: Upload bridge signatures (workflow artifact)
        if: runner.os != 'Linux' && steps.signing.outputs.ready == 'true' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: bridge-signatures-${{ runner.os }}
          path: release/*.sig
          if-no-files-found: error
          retention-days: 7

      # Installers as CI artifacts on every leg remain a short-lived backup.
      # GitHub wraps these files in an outer ZIP; release consumers should use
      # the individual assets uploaded above or by electron-builder. Unsigned
      # backups are suffixed -unsigned-smoke to preserve their provenance.
      - name: Upload installers (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}${{ steps.signing.outputs.ready != 'true' && '-unsigned-smoke' || '' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: ignore
          retention-days: 7

      - name: Guard update manifests
        shell: bash
        run: |
          set -euo pipefail
          # Ported from the tauri-era structural guard: any release build with no
          # update manifest is a broken release → CI red. Blockmaps are the
          # differential-download companions and must ship alongside — but on
          # Linux electron-builder embeds the AppImage blockmap INSIDE the
          # .AppImage (no separate file, deb never has one), so the blockmap
          # file check only applies to macOS/Windows.
          if [ "${{ runner.os }}" != 'Linux' ]; then
            compgen -G 'release/*.blockmap' > /dev/null || { echo "::error::no .blockmap files under release/"; exit 1; }
          fi
          if [ "${{ runner.os }}" = 'macOS' ]; then
            [ -s release/latest-mac.yml ] || { echo "::error::missing release/latest-mac.yml"; exit 1; }
            # Dual-arch integration guard: latest-mac.yml must list BOTH the
            # x64 and the arm64 assets from the single-runner dual-arch build.
            grep -q 'arm64' release/latest-mac.yml || { echo "::error::latest-mac.yml missing arm64 asset"; exit 1; }
            grep -q 'x64' release/latest-mac.yml || { echo "::error::latest-mac.yml missing x64 asset"; exit 1; }
          elif [ "${{ runner.os }}" = 'Windows' ]; then
            [ -s release/latest.yml ] || { echo "::error::missing release/latest.yml"; exit 1; }
          elif [ "${{ runner.os }}" = 'Linux' ]; then
            # U10: AppImage auto-update manifest (KTD-5 primary artifact).
            [ -s release/latest-linux.yml ] || { echo "::error::missing release/latest-linux.yml"; exit 1; }
            grep -q 'AppImage' release/latest-linux.yml || { echo "::error::latest-linux.yml missing AppImage asset"; exit 1; }
            compgen -G 'release/*.AppImage' > /dev/null || { echo "::error::no AppImage artifact under release/"; exit 1; }
            compgen -G 'release/*.deb' > /dev/null || { echo "::error::no deb artifact under release/"; exit 1; }
          fi
          echo "Update manifests + blockmaps present"

      # Draft-first-then-test-endpoints (ported from the tauri-era guard):
      # GitHub's /releases/latest/download/* convenience endpoint only
      # resolves for PUBLISHED releases, so the draft's asset list is tested
      # via the API instead. The release is published manually after all
      # matrix legs are green.
      - name: Test draft release endpoints
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # NOTE: the REST releases/tags/<tag> endpoint 404s on draft releases
          # whose tag was deleted/re-created (association severed permanently);
          # `gh release view` resolves drafts by tag_name and is robust to tag
          # churn. Retry briefly for publish/overwrite eventual consistency.
          if [ "${{ runner.os }}" = 'macOS' ]; then
            manifest=latest-mac.yml
          elif [ "${{ runner.os }}" = 'Windows' ]; then
            manifest=latest.yml
          elif [ "${{ runner.os }}" = 'Linux' ]; then
            manifest=latest-linux.yml
          fi
          assets=""
          for attempt in 1 2 3 4 5; do
            assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' || true)"
            echo "$assets" | grep -Fxq "$manifest" && break
            [ "$attempt" = 5 ] && { echo "::error::draft release missing $manifest asset (got: ${assets:-<none>})"; exit 1; }
            sleep 10
          done
          echo "Draft release carries $manifest"

      # U6 (KTD-3): the tauri-format latest.json is generated by the
      # bridge-manifest job below — it needs artifacts from ALL matrix legs,
      # so the "missing latest.json = build failure" guard lives there, not
      # in this per-platform endpoint test.

  # This is deliberately post-matrix: individual matrix legs may create or
  # upload to the same draft release, but only this job writes its body.
  release-signing-status:
    name: Record release signing status
    needs: build
    runs-on: ubuntu-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Preserve notes and record signing status
        shell: bash
        run: |
          set -euo pipefail
          mac_status='SIGNED and notarized'
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            mac_status='UNSIGNED — full code-signing and notarization credentials were unavailable'
          fi
          windows_status='SIGNED with Azure Trusted Signing'
          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] \
             || [ -z "$AZURE_TRUSTED_SIGNING_PUBLISHER" ] || [ -z "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] \
             || [ -z "$AZURE_TRUSTED_SIGNING_CERT_PROFILE" ] || [ -z "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            windows_status='UNSIGNED — full Azure Trusted Signing credentials were unavailable'
          fi

          status_file="$(mktemp)"
          cat > "$status_file" <<EOF
          <!-- comate-signing-status:start -->
          ## Signing status

          - macOS: **${mac_status}**
          - Windows: **${windows_status}**
          - Linux: No platform signing requirement; Linux release assets are published without a platform signature.

          <!-- comate-signing-status:end -->
          EOF

          existing_body="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > "$existing_body"
          updated_body="$(mktemp)"
          node - "$existing_body" "$status_file" "$updated_body" <<'NODE'
          const fs = require('node:fs');
          const [existingPath, statusPath, outputPath] = process.argv.slice(2);
          const existing = fs.readFileSync(existingPath, 'utf8');
          const status = fs.readFileSync(statusPath, 'utf8').trim();
          const start = '<!-- comate-signing-status:start -->';
          const end = '<!-- comate-signing-status:end -->';
          const escapeRegExp = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const managed = new RegExp(`\\n?${escapeRegExp(start)}[\\s\\S]*?${escapeRegExp(end)}\\n?`, 'g');
          const preserved = existing.replace(managed, '').trimEnd();
          fs.writeFileSync(outputPath, `${preserved}${preserved ? '\\n\\n' : ''}${status}\\n`);
          NODE
          gh release edit "$GITHUB_REF_NAME" --notes-file "$updated_body"

          verified_body="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > "$verified_body"
          node - "$verified_body" "$status_file" <<'NODE'
          const fs = require('node:fs');
          const [bodyPath, statusPath] = process.argv.slice(2);
          const body = fs.readFileSync(bodyPath, 'utf8');
          const status = fs.readFileSync(statusPath, 'utf8').trim();
          if (!body.includes(status)) {
            throw new Error('draft release body is missing the managed signing-status section');
          }
          NODE

  # ---------------------------------------------------------------------------
  # U6 bridge manifest (KTD-3 dual manifest families). Generates the
  # tauri-format latest.json — pointing at the Electron installers — uploads
  # it to the same draft release, and guards that BOTH manifest families are
  # present. From the bridge release onward every release must carry
  # latest.json until the Tauri install base drains to zero; a missing or
  # badly-signed latest.json fails this job (and thus the build).
  # ---------------------------------------------------------------------------
  bridge-manifest:
    name: Bridge manifest (tauri latest.json)
    needs: build
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The bridge needs the FINAL signed mac+win artifacts, so its sentinel
      # is the full signing chain — not the tauri key alone: without mac
      # (CSC + notarize) and Windows (Azure) credentials the matrix legs run
      # unsigned and publish nothing, and this job must skip in lockstep
      # rather than fail on missing draft assets.
      - name: Determine bridge readiness
        id: gating
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$CSC_LINK" ] \
             && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] \
             && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
             && [ -n "$AZURE_TRUSTED_SIGNING_PUBLISHER" ] && [ -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] \
             && [ -n "$AZURE_TRUSTED_SIGNING_CERT_PROFILE" ] && [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.gating.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        if: steps.gating.outputs.ready == 'true'
        run: npm ci

      - name: Unsigned run notice
        if: steps.gating.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::notice::signing chain incomplete (tauri key / mac CSC+notarize / Windows Azure) — unsigned smoke run; skipping bridge manifest (lockstep with the unsigned matrix legs)."

      - name: Download bridge signatures
        if: steps.gating.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-signatures-*
          path: bridge-sigs
          merge-multiple: true

      # Download the FINAL bridge assets from the draft release itself, so the
      # signature check below verifies exactly the bytes users will get.
      - name: Download bridge assets from the draft release
        if: steps.gating.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge-assets bridge-yml
          gh release download "$GITHUB_REF_NAME" --dir bridge-assets --clobber \
            -p '*-mac-arm64.app.tar.gz' -p '*-mac-x64.app.tar.gz' -p '*-win-*.exe'
          # The Electron-line update manifests carry the package.json version;
          # generate/check below cross-check them against the tag-derived
          # bridge version so a tag/package.json mismatch fails loudly.
          gh release download "$GITHUB_REF_NAME" --dir bridge-yml --clobber \
            -p 'latest.yml' -p 'latest-mac.yml' -p 'latest-linux.yml'
          ls -la bridge-assets bridge-sigs bridge-yml

      - name: Generate + verify + upload latest.json
        if: steps.gating.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mac_arm64="$(basename bridge-assets/*-mac-arm64.app.tar.gz)"
          mac_x64="$(basename bridge-assets/*-mac-x64.app.tar.gz)"
          win_x64="$(basename bridge-assets/*-win-*.exe)"
          yml_args=()
          for y in bridge-yml/latest*.yml; do yml_args+=(--yml "$y"); done
          [ "${#yml_args[@]}" -gt 0 ] || { echo "::error::no latest*.yml downloaded from the draft release"; exit 1; }
          tsx scripts/build-bridge-manifest.ts generate \
            --version "$VERSION" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --asset "darwin-aarch64=${mac_arm64}=@bridge-sigs/${mac_arm64}.sig" \
            --asset "darwin-x86_64=${mac_x64}=@bridge-sigs/${mac_x64}.sig" \
            --asset "windows-x86_64=${win_x64}=@bridge-sigs/${win_x64}.sig" \
            "${yml_args[@]}" \
            --out bridge/latest.json
          # KTD-9 order guard: every platform signature must verify against
          # the RELEASED bytes. minisign-before-Authenticode (or any artifact
          # mutation after signing) fails here — anti-regression for the
          # signing order. The --yml cross-check re-verifies that the bridge
          # version equals the Electron-line latest*.yml version.
          tsx scripts/build-bridge-manifest.ts check bridge/latest.json --assets-dir bridge-assets "${yml_args[@]}"
          gh release upload "$GITHUB_REF_NAME" bridge/latest.json --clobber

      # KTD-3 guard: the draft release must serve BOTH manifest families —
      # latest.json (old line) and latest*.yml (new line). Missing
      # latest.json = build failure, from the bridge release onward.
      - name: Guard dual manifest families on the draft release
        if: steps.gating.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # gh release view, not the REST tags endpoint — the latter 404s on
          # drafts whose tag was deleted/re-created (see the per-leg step).
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          echo "$assets"
          echo "$assets" | grep -Fxq 'latest.json' || { echo "::error::draft release missing latest.json (tauri bridge manifest)"; exit 1; }
          echo "$assets" | grep -Eq '^latest(-mac|-linux)?\.yml$' || { echo "::error::draft release missing latest*.yml (electron-updater manifests)"; exit 1; }
          echo "Draft release serves both manifest families (latest.json + latest*.yml)"
